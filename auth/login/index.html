<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocoPrime - Entrar</title>
    <!-- Google Fonts: DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <!-- Logotipo FocoPrime -->
        <div class="auth-logo-wrapper">
            <img src="../../assets/logo.png" alt="FocoPrime Logo" class="auth-logo" onerror="this.src='https://placehold.co/120x36/6366f1/ffffff?text=FocoPrime'">
        </div>

        <h1 class="auth-title">Bem-vindo ao FocoPrime</h1>
        <p class="auth-subtitle">Não tem uma conta? <a href="../cadastro/index.html" class="auth-link">Cadastre-se grátis</a></p>

        <!-- Overlay / Modal de Progresso de Processamento -->
        <div class="processing-overlay" id="processingOverlay">
            <div class="processing-card">
                <div class="processing-spinner"></div>
                <h3 id="processingTitle">Entrando na sua conta...</h3>
                <p id="processingSubtitle">Verificando credenciais no Firebase</p>
                <div class="processing-progress-bar">
                    <div class="processing-progress-fill" id="processingProgressFill"></div>
                </div>
                <span class="processing-percentage" id="processingPercentage">0%</span>
            </div>
        </div>

        <form class="auth-form" id="loginForm">
            <div class="auth-input-group">
                <label for="loginInput">E-mail ou Nome de usuário</label>
                <input type="text" id="loginInput" placeholder="Digite seu e-mail ou usuário" required>
            </div>
            
            <div class="auth-input-group">
                <label for="passwordInput">Senha</label>
                <input type="password" id="passwordInput" placeholder="Sua senha" required>
            </div>

            <p class="auth-terms">
                Ao clicar em "Entrar", você concorda com nossos <a href="#" class="auth-link">Termos de Uso</a> e reconhece nossa <a href="#" class="auth-link">Política de Privacidade</a>.
            </p>

            <button type="submit" class="auth-btn-primary" id="btnSubmit">
                <span id="btnSubmitText">Entrar</span>
            </button>

            <div class="auth-divider"><span>ou</span></div>

            <button type="button" class="auth-btn-social" id="btnGoogle">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.87 0 12s.43 3.88 1.19 5.42l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                Continuar com o Google
            </button>
        </form>

        <div class="auth-footer-link">
            <a href="#" id="forgotPasswordBtn" class="auth-link">Esqueceu a senha?</a>
        </div>
    </div>

    <!-- Script com Firebase Real e Animação de Progresso -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider,
            sendPasswordResetEmail 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwj0vcsUbdFDwFLt3xfOHCC--OhpF6nXs",
            authDomain: "focoplataforms.firebaseapp.com",
            databaseURL: "https://focoplataforms-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "focoplataforms",
            storageBucket: "focoplataforms.firebasestorage.app",
            messagingSenderId: "363051075501",
            appId: "1:363051075501:web:3ed9f67c5b46badce34324"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const processingOverlay = document.getElementById('processingOverlay');
        const processingTitle = document.getElementById('processingTitle');
        const processingSubtitle = document.getElementById('processingSubtitle');
        const processingProgressFill = document.getElementById('processingProgressFill');
        const processingPercentage = document.getElementById('processingPercentage');

        // Função para animar a barra de progresso
        function runProgressAnimation(targetPercent, duration, titleText, subtitleText) {
            return new Promise((resolve) => {
                if (titleText) processingTitle.textContent = titleText;
                if (subtitleText) processingSubtitle.textContent = subtitleText;

                let currentPercent = parseInt(processingProgressFill.style.width) || 0;
                let startTime = null;

                function step(timestamp) {
                    if (!startTime) startTime = timestamp;
                    let progress = timestamp - startTime;
                    let current = Math.min(currentPercent + (targetPercent - currentPercent) * (progress / duration), targetPercent);
                    
                    processingProgressFill.style.width = current + '%';
                    processingPercentage.textContent = Math.round(current) + '%';

                    if (progress < duration && current < targetPercent) {
                        requestAnimationFrame(step);
                    } else {
                        resolve();
                    }
                }
                requestAnimationFrame(step);
            });
        }

        // Submissão do Formulário de Login (E-mail ou Username + Senha)
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const loginInput = document.getElementById('loginInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            processingOverlay.classList.add('active');
            processingProgressFill.style.width = '0%';
            processingPercentage.textContent = '0%';

            try {
                await runProgressAnimation(25, 300, 'Verificando...', 'Localizando credenciais');

                let email = loginInput;

                // Se o usuário digitou um nome de usuário (sem @), buscamos o e-mail correspondente no Realtime Database
                if (!loginInput.includes('@')) {
                    const usersRef = ref(db, 'users');
                    const userQuery = query(usersRef, orderByChild('username'), equalTo(loginInput));
                    const snapshot = await get(userQuery);

                    if (!snapshot.exists()) {
                        throw new Error('Nome de usuário não encontrado.');
                    }

                    const userDataObj = snapshot.val();
                    const userId = Object.keys(userDataObj)[0];
                    email = userDataObj[userId].email;
                }

                await runProgressAnimation(60, 400, 'Autenticando...', 'Validando senha no Firebase Auth');
                
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await runProgressAnimation(85, 400, 'Carregando perfil...', 'Buscando dados no Realtime Database');

                const userRef = ref(db, 'users/' + user.uid);
                const userSnapshot = await get(userRef);

                let userData = {};
                if (userSnapshot.exists()) {
                    userData = userSnapshot.val();
                } else {
                    userData = {
                        uid: user.uid,
                        email: user.email,
                        username: user.email.split('@')[0],
                        displayName: user.displayName || user.email.split('@')[0],
                        plan: 'Pessoal · Gratuito',
                        credits: 250
                    };
                }

                await runProgressAnimation(100, 300, 'Sucesso!', 'Redirecionando para o FocoPrime');

                // Salva a sessão no localStorage para leitura imediata na Dashboard
                localStorage.setItem('focoai_user', JSON.stringify(userData));

                setTimeout(() => {
                    window.location.href = '../../index.html';
                }, 400);

            } catch (error) {
                console.error(error);
                processingOverlay.classList.remove('active');
                alert('Erro ao entrar: ' + (error.code === 'auth/invalid-credential' ? 'E-mail, usuário ou senha incorretos.' : error.message));
            }
        });

        // Login Social com Google
        const btnGoogle = document.getElementById('btnGoogle');
        btnGoogle.addEventListener('click', async () => {
            processingOverlay.classList.add('active');
            processingProgressFill.style.width = '0%';
            processingPercentage.textContent = '0%';

            try {
                await runProgressAnimation(40, 400, 'Conectando ao Google...', 'Autenticando conta Google');
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                await runProgressAnimation(80, 500, 'Carregando perfil...', 'Sincronizando dados com o banco');

                const userRef = ref(db, 'users/' + user.uid);
                const userSnapshot = await get(userRef);

                let userData = {};
                if (userSnapshot.exists()) {
                    userData = userSnapshot.val();
                } else {
                    const defaultUsername = user.email ? user.email.split('@')[0] : 'usuario';
                    userData = {
                        uid: user.uid,
                        email: user.email,
                        username: defaultUsername,
                        displayName: user.displayName || defaultUsername,
                        photoURL: user.photoURL || '',
                        plan: 'Pessoal · Gratuito',
                        credits: 250,
                        createdAt: new Date().toISOString()
                    };
                    // Salva se for novo
                    const { set } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js");
                    await set(userRef, userData);
                }

                await runProgressAnimation(100, 300, 'Pronto!', 'Tudo configurado com sucesso');

                localStorage.setItem('focoai_user', JSON.stringify(userData));
                setTimeout(() => {
                    window.location.href = '../../index.html';
                }, 400);

            } catch (error) {
                console.error(error);
                processingOverlay.classList.remove('active');
                alert('Erro no login com Google: ' + error.message);
            }
        });

        // Esqueceu a senha
        document.getElementById('forgotPasswordBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            const emailInput = prompt('Digite seu e-mail cadastrado para redefinir a senha:');
            if (!emailInput) return;

            try {
                await sendPasswordResetEmail(auth, emailInput.trim());
                alert('E-mail de redefinição de senha enviado com sucesso! Verifique sua caixa de entrada.');
            } catch (error) {
                alert('Erro ao enviar e-mail de recuperação: ' + error.message);
            }
        });
    </script>
</body>
</html>
